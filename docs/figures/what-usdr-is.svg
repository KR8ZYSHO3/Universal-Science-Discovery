<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 200" role="img" aria-labelledby="title desc">
  <title id="title">What USDR is</title>
  <desc id="desc">A catalog of open questions and bridges. This site is a view of that catalog. Crosscheck is a test you can run.</desc>
  <rect width="960" height="200" rx="16" fill="#060d1a"/>
  <text x="480" y="36" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#ddeeff">What you are looking at</text>

