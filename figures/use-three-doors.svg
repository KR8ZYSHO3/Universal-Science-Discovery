<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">How to use USDR — three ways in</title>
  <desc id="desc">Run the test, see how two fields connect, or add an open question.</desc>
  <rect width="960" height="360" rx="16" fill="#060d1a"/>
  <text x="480" y="42" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#ddeeff">How to use this catalog</text>
  <text x="480" y="68" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#6b8aac">Pick one. Then stop.</text>

  <rect x="28" y="92" width="288" height="240" rx="14" fill="#0b1527" stroke="#4f9cf9" stroke-width="1.5"/>
  <circle cx="68" cy="132" r="18" fill="rgba(79,156,249,0.15)" stroke="#4f9cf9"/>
  <circle cx="66" cy="130" r="7" fill="none" stroke="#4f9cf9" stroke-width="2"/>
  <line x1="71" y1="135" x2="78" y2="142" stroke="#4f9cf9" stroke-width="2" stroke-linecap="round"/>
  <text x="100" y="128" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#6b8aac" letter-spacing="1.4">1 · RUN THE TEST</text>
  <text x="100" y="150" font-family="system-ui,Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#4f9cf9">Run the test</text>
  <text x="48" y="188" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#ddeeff">Habitat / percolation</text>
  <text x="48" y="214" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#ddeeff">Opens in the browser</text>
  <text x="48" y="240" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#ddeeff">No account needed</text>
  <text x="48" y="278" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#6b8aac">Ten minutes.</text>
  <text x="48" y="302" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#4f9cf9">Stop when you have seen it.</text>

  <rect x="336" y="92" width="288" height="240" rx="14" fill="#0b1527" stroke="#22d3b8" stroke-width="1.5"/>
  <circle cx="376" cy="132" r="18" fill="rgba(34,211,184,0.12)" stroke="#22d3b8"/>
  <rect x="368" y="122" width="16" height="20" rx="2" fill="none" stroke="#22d3b8" stroke-width="2"/>
  <line x1="372" y1="128" x2="380" y2="128" stroke="#22d3b8" stroke-width="1.5"/>
  <line x1="372" y1="133" x2="380" y2="133" stroke="#22d3b8" stroke-width="1.5"/>
  <text x="408" y="128" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#6b8aac" letter-spacing="1.4">2 · CONNECT</text>
  <text x="408" y="146" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#22d3b8">See how two fields</text>
  <text x="408" y="168" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#22d3b8">connect</text>
  <text x="356" y="198" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#ddeeff">Pick two fields</text>
  <text x="356" y="224" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#ddeeff">Map shows a real path</text>
  <text x="356" y="250" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#ddeeff">No account needed</text>
  <text x="356" y="278" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#6b8aac">From the catalog graph.</text>
  <text x="356" y="302" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#22d3b8">Not a guess.</text>

  <rect x="644" y="92" width="288" height="240" rx="14" fill="#0b1527" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="684" cy="132" r="18" fill="rgba(167,139,250,0.12)" stroke="#a78bfa"/>
  <rect x="676" y="124" width="16" height="16" rx="2" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <polyline points="680,130 684,134 692,126" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="716" y="128" font-family="system-ui,Segoe UI,sans-serif" font-size="11" fill="#6b8aac" letter-spacing="1.4">3 · ADD</text>
  <text x="716" y="146" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#a78bfa">Add an open</text>
  <text x="716" y="168" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#a78bfa">question</text>
  <text x="664" y="198" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#ddeeff">One gap from your field</text>
  <text x="664" y="224" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#ddeeff">Check the record</text>
  <text x="664" y="250" font-family="system-ui,Segoe UI,sans-serif" font-size="14" fill="#ddeeff">Send it for review</text>
  <text x="664" y="278" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#6b8aac">Only if you have one.</text>
  <text x="664" y="302" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#a78bfa">A person reads it first.</text>
</svg>
