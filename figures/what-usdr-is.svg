<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" role="img" aria-labelledby="title desc">
  <title id="title">What USDR is</title>
  <desc id="desc">A catalog of open questions and bridges. This site is a view of that catalog. Crosscheck is a test you can run.</desc>
  <rect width="960" height="200" rx="16" fill="#060d1a"/>
  <text x="480" y="36" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="16" font-weight="700" fill="#ddeeff">What you are looking at</text>

  <rect x="28" y="58" width="260" height="118" rx="12" fill="#0b1527" stroke="rgba(79,156,249,0.35)"/>
  <text x="158" y="88" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#6b8aac" letter-spacing="1.2">CATALOG</text>
  <text x="158" y="118" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#4f9cf9">Open questions</text>
  <text x="158" y="144" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#ddeeff">unknowns · hypotheses · bridges</text>
  <text x="158" y="164" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#6b8aac">The source</text>

  <polygon points="300,117 328,107 328,127" fill="#6b8aac"/>

  <rect x="340" y="58" width="260" height="118" rx="12" fill="#0b1527" stroke="rgba(34,211,184,0.35)"/>
  <text x="470" y="88" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#6b8aac" letter-spacing="1.2">THIS SITE</text>
  <text x="470" y="118" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#22d3b8">Search + map</text>
  <text x="470" y="144" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#ddeeff">a view of the catalog, not a second database</text>
  <text x="470" y="164" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#6b8aac">Browse here</text>

  <polygon points="612,117 640,107 640,127" fill="#6b8aac"/>

  <rect x="652" y="58" width="280" height="118" rx="12" fill="#0b1527" stroke="rgba(167,139,250,0.4)"/>
  <text x="792" y="88" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#6b8aac" letter-spacing="1.2">A TEST</text>
  <text x="792" y="118" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#a78bfa">Run an experiment</text>
  <text x="792" y="144" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="13" fill="#ddeeff">confirmed, or not yet conclusive</text>
  <text x="792" y="164" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="12" fill="#6b8aac">In the browser</text>
</svg>
