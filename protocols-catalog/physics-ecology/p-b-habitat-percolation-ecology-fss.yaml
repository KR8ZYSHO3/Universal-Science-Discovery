id: p-b-habitat-percolation-ecology-fss
title: >
  Finite-size scaling test — does the 2D site percolation threshold shift with
  lattice area as p_c(L) = p_c(inf) + c * L^(-1/nu) with nu = 4/3?
status: executed
source_bridge: b-habitat-percolation-ecology
source_hypothesis: h-habitat-percolation-critical-density
source_unknown: u-habitat-fragmentation-threshold
pollination_index: 0
falsifiable_prediction: >
  On an L×L square (4-neighbor, periodic), the mean occupation at first
  either-direction wrapping obeys p_c(L) = p_c(inf) + c L^(-1/nu) with
  p_c(inf) = 0.59274621. A weighted fit on L ∈ {32, 64, 128, 256} recovers
  nu within 15% of 4/3, with reported SE(nu) inside that tolerance.
  Sign of c is not assumed. L=16 is diagnostic only. The in-browser runner
  is a smoke test and cannot confirm nu.
null_hypothesis: >
  Threshold estimates are independent of lattice size (c consistent with 0),
  or a powered fit disagrees with nu = 4/3 by more than 15%.
  Underpowered runs are INCONCLUSIVE, not evidence against percolation.
translation_mapping:
  - field_a_term: site percolation threshold p_c
    field_b_term: critical habitat coverage fraction below which connectivity collapses
  - field_a_term: finite-size scaling correction to p_c
    field_b_term: threshold shift in smaller landscape patches vs continental-scale habitat
  - field_a_term: universality class (2D percolation, nu=4/3)
    field_b_term: spatial connectivity structure independent of landscape geometry
experimental_design:
  - >
      Run 2D site percolation on L×L squares, 4-neighbor, periodic boundary
      conditions, L in {16, 32, 64, 128, 256}.
  - >
      For each L, use Newman–Ziff union-find. Named estimator p_c(L) is the mean
      occupation fraction at first wrapping in either direction (horizontal or
      vertical). Report the sample SE of the mean. Do not use open-boundary
      top-bottom spanning probability = 0.5 (Cardy crossing tends to 1/2 at
      p_c(inf), so the leading L^{-1/nu} amplitude vanishes).
  - >
      Fit p_c(L) = p_c(inf) + c L^{-1/nu} on L in {32, 64, 128, 256} only,
      weighted by SE. Fit A fixes p_c(inf) and fits c and nu. Fit B fixes
      nu=4/3 and fits c. Do not take abs(delta) if signs mix.
  - >
      CONFIRMED if Fit A has nu within 15% of 4/3, SE(nu) at most 15% of 4/3,
      |c| > 2 SE(c), R² at least 0.85, and |p_c(L)-p_c(inf)| shrinks with L
      within 2 sigma. INCONCLUSIVE means underpowered. FALSIFIED means powered
      disagreement. Browser JS uses L in {16,32,48,64} and 48 samples/L and
      must print INCONCLUSIVE.
  - >
      Document seed, sample count, wall-clock, and a power estimate (samples/L
      so SE(nu) meets the 15% tolerance).
statistical_analysis_plan: >
  Weighted least squares of (p_c(L) - 0.59274621) vs L^{-1/nu}. Fit A scans nu
  and takes the chi² minimum; SE(nu) from the chi²+1 contour. Fit B fixes
  nu=4/3. Width sigma(p_span) ~ L^{-1/nu} is a sanity check, not the pass
  criterion. INCONCLUSIVE is first-class (underpowered), not "theory false".
feasibility_tier: desktop
repro_bundle: repro/p-b-habitat-percolation-ecology-fss/
estimated_runtime: >
  ~15–40 s on a laptop at 400 Newman–Ziff samples/L (canonical). Browser smoke
  test ~10–30 s and cannot confirm nu.
last_reviewed: "2026-08-27"
