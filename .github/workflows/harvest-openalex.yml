name: Wave Factory Cadence

on:
  schedule:
    - cron: "0 6 * * 1,4" # Monday + Thursday 06:00 UTC
  workflow_dispatch:

jobs:
  wave-factory:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Full clone + token: create-pull-request pushes a new branch; shallow checkout
      # commonly surfaces as `git` exit 128 with peter-evans/create-pull-request.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Harvest OpenAlex candidates
        continue-on-error: true
        run: |
          python scripts/harvesters/harvest_openalex.py \
            --bridge-scan \
            --top 20 \
            --output drafts/openalex_candidates.json

      - name: Harvest PubMed candidates
        continue-on-error: true
        run: |
          python scripts/harvesters/harvest_pubmed.py \
            --bridge-scan \
            --top 20 \
            --output drafts/pubmed_candidates.json

      - name: Harvest Semantic Scholar candidates
        continue-on-error: true
        run: |
          python scripts/harvesters/harvest_semantic_scholar.py \
            --bridge-scan \
            --top 20 \
            --output drafts/semantic_scholar_candidates.json

      - name: Night crew (scout, audit, brief — never promote)
        run: |
          python scripts/run_crew.py --skip-harvest --top 30 --min-citations 50
          if [ -f drafts/crew-reports/LATEST.md ]; then
            cat drafts/crew-reports/LATEST.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload gitignored Wave Factory stage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wave-factory-stage
          path: drafts/wave_factory/
          if-no-files-found: ignore

      - name: Detect crew output changes
        id: stage
        run: |
          if git ls-files --modified --others --exclude-standard | grep -E '^(drafts/openalex_candidates\.json|drafts/pubmed_candidates\.json|drafts/semantic_scholar_candidates\.json|drafts/crew-reports/)' > /dev/null; then
            echo "changes=1" >> "$GITHUB_OUTPUT"
          else
            echo "changes=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR for harvest JSON + crew briefing
        if: success() && steps.stage.outputs.changes != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/wave-factory
          commit-message: "bot: crew briefing and harvest candidates [skip ci]"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          title: "bot: night crew briefing (do not treat as findings)"
          body: |
            Night crew run (Foreman). **Not a scientific result. Do not merge as confirmed bridges.**

            - Harvested OpenAlex + PubMed + Semantic Scholar (candidate JSON)
            - Scout staged triples in gitignored `drafts/wave_factory/` (artifact on this job)
            - Auditor: schema validate + promote **dry-run** (never `--apply`)
            - Tester: Crosscheck contracts only (no Monte Carlo)
            - Briefing: `drafts/crew-reports/LATEST.md`

            Review the briefing. Promote only by hand after editing translation tables.
          labels: |
            automation
            wave-factory
            crew
          delete-branch: false
          add-paths: |
            drafts/openalex_candidates.json
            drafts/pubmed_candidates.json
            drafts/semantic_scholar_candidates.json
            drafts/crew-reports/LATEST.md
